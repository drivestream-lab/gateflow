# Gateflow programme config (non-secret). Secrets stay in env / secret store.
# Override path with PROGRAMME_CONFIG_PATH.
#
# INIT-GATEFLOW-002: label below is NOT a wave-start mechanism (FR-15).
# Use POST /api/v1/waves/start with the programme service token.

trigger:
  label: gateflow:run-wave

handoff:
  ref: pr_head
  ref_fallback: default_branch
  artifact_globs:
    - docs/specification/reports/**/*
    - prd/reports/**/*

retry:
  findings_budget: 3

metrics:
  retention_days: 90

runner:
  default: cursor

model:
  profiles:
    default: cursor/auto
    loop: cursor/fast
    ground: cursor/auto
  overrides:
    loop-spec:
      profile: loop
      runner: cursor
    ground-spec:
      profile: ground
      runner: cursor

tools:
  slots: {}

notifier:
  default: github_comment

pr:
  branch_prefix: gateflow/run-
  title_template: "[gateflow] {initiative_id} {wave_id} {run_id_short}"
  body_template: "Run `{run_id}` — status API supplementary."
  base_branch: develop
